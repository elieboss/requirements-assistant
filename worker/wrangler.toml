# One Worker serves both the built React app and the /api endpoints, so the site has a single URL.
name = "requirements-assistant"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
